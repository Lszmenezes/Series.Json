<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Séries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Catálogo de Séries</h1>

    <button id="btnCarregar">Carregar Séries</button>

    <div class="generos">
        <button class="btn-genero ativo" data-genero="Todos">Todos</button>
        <button class="btn-genero" data-genero="Ficção">Ficção</button>
        <button class="btn-genero" data-genero="Crime">Crime</button>
        <button class="btn-genero" data-genero="Comédia">Comédia</button>
        <button class="btn-genero" data-genero="Fantasia">Fantasia</button>
        <button class="btn-genero" data-genero="Drama">Drama</button>
    </div>

    <div id="listaSeries"></div>

    <script src="app.js"></script>
</body>
</html>
